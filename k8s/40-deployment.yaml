apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediator
  namespace: remediation
  labels:
    app: remediator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediator
  template:
    metadata:
      labels:
        app: remediator
    spec:
      serviceAccountName: remediator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remediator
          # Built locally and loaded via `kind load docker-image`.
          # imagePullPolicy: Never avoids any attempt to pull from a registry.
          image: incident-auto-remediation:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: remediator-config
            - secretRef:
                name: remediator-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: remediator
  namespace: remediation
  labels:
    app: remediator
spec:
  selector:
    app: remediator
  ports:
    - name: http
      port: 80
      targetPort: http
