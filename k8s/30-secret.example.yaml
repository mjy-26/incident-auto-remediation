# EXAMPLE secret — copy to 30-secret.yaml and fill in real values if (and only
# if) you want Slack/Jira notifications. Leaving these empty keeps notifications
# DISABLED (no cost, no external calls). Do NOT commit the real 30-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: remediator-secrets
  namespace: remediation
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: ""
  JIRA_BASE_URL: ""
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
